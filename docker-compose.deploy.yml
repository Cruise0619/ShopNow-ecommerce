services:
  mysql:
    image: mysql:8.0
    container_name: shopnow-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-xuanxuan0513}
      MYSQL_DATABASE: ecommerce
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - shopnow-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: shopnow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - shopnow-net
    command: >
      redis-server
      --appendonly yes
      --save 900 1
      --save 300 10
      --save 60 10000
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    image: cruise0619/shopnow-backend:latest
    container_name: shopnow-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ecommerce?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
      SPRING_REDIS_HOST: redis
      DB_PASSWORD: ${DB_PASSWORD:-xuanxuan0513}
      JWT_SECRET: ${JWT_SECRET:-ecommerce_jwt_secret_key_2024_secure!}
      PAYMENT_FRONTEND_PORT: "80"
      PAYMENT_EXTERNAL_URL: ${PAYMENT_EXTERNAL_URL:-}
    ports:
      - "8080:8080"
    volumes:
      - uploads-data:/app/uploads
    networks:
      - shopnow-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/products"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 90s

  frontend:
    image: cruise0619/shopnow-frontend:latest
    container_name: shopnow-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - shopnow-net

volumes:
  mysql-data:
  redis-data:
  uploads-data:

networks:
  shopnow-net:
    driver: bridge
